# Site do portal CitizenTech (instalado por scripts/02-aplicacao.sh)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name citizentech.local citizentech-srv _;

    root /var/www/citizentech;
    index index.html;

    access_log /var/log/nginx/citizentech-acesso.log;
    error_log  /var/log/nginx/citizentech-erro.log;

    add_header X-CitizenTech-Servidor $hostname always;

    # Usado pelo monitor para saber se a aplicação está no ar
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","servico":"citizentech"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
